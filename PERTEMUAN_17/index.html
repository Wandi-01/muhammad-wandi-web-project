<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pertemuan 17</title>
    <style>
      * {
        border: 2px solid;
        padding: 20px;
        margin: 20px;
        box-sizing: border-box;
      }
      html {
        margin: 0;
        padding: 0;
      }
      body {
        max-width: 1000px;
        margin: 30px auto;
        padding: 20px;
        font-family: "Trebuchet MS", "Lucida Sans Unicode", "Lucida Grande", "Lucida Sans", Arial, sans-serif;
        font-size: 18px;
        color: #333;
      }
      #judul {
        font-size: 36px;
        text-align: center;
        background-color: #e0e0e0;
      }
      #container {
        width: 100%;
        padding: 20px;
      }
      section {
        min-height: 200px;
        padding: 20px;
      }
      p {
        font-size: 20px;
      }
      a {
        display: block;
        font-size: 18px;
      }
      li {
        font-size: 20px;
      }
    </style>
  </head>
  <body>
    <h1 id="judul">Document Object Model (DOM)</h1>
    <div id="container">
      <section id="a">
        <p class="p1">paragraft 1</p>
        <a href="https://instagram.com/testing">Link testing</a>
        <p class="p2">paragraft 2</p>
        <p class="p3">Paragraft 3</p>
      </section>
      <section id="b">
        <p class="p4">Paragraft 4</p>
        <ul>
          <li class="l1">item 1</li>
          <li class="l2">item 2</li>
          <li class="l3">item 3</li>
        </ul>
      </section>
    </div>
    <script src="script.js"></script>
  </body>
</html>
