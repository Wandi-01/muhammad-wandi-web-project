<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulasi Perhitungan Belanja</title>
</head>
<body>
    <h1>SIMULASI PERHITUNGAN BELANJA</h1>

    <label for="nama">Nama Pembeli:</label><br>
    <input type="text" id="nama"><br><br>

    <label for="belanja">Total Belanja (Rp):</label><br>
    <input type="number" id="belanja" min="0" step="1"><br><br>

    <button type="button" onclick="hitungTotal()">Hitung Total</button>

    <h2>Hasil Perhitungan</h2>
    <div id="hasil"></div>

    <script src="script.js"></script>
</body>
</html>
